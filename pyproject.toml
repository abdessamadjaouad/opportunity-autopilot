[project]
name = "opportunity-autopilot"
version = "0.1.0"
description = "Private, evidence-backed opportunity discovery and application workflow"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "cryptography>=50,<51", "itsdangerous>=2.2,<3",
  "celery[redis]>=5.5,<6", "beautifulsoup4>=4.13,<5", "defusedxml>=0.7,<1",
  "python-multipart>=0.0.20,<1", "pypdf>=6,<8", "playwright>=1.55,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: launches Chromium", "postgres: requires TEST_POSTGRES_URL", "live_read: optional public read-only connector smoke test"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
